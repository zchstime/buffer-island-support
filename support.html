  <h1>缓冲岛支持</h1>
  <p>感谢使用缓冲岛。如果你遇到问题或希望提出建议，请发送邮件至 <a href="mailto:918953140@qq.com">918953140@qq.com</a>。</p>
  <h2>常见问题</h2>
  <p><strong>数据保存在哪里？</strong><br>签到和笔记只保存在当前设备，不会上传到服务器。</p>
  <p><strong>如何备份？</strong><br>打开“更多”，选择“导出 JSON 备份”。</p>
  <p><strong>如何删除记录？</strong><br>在趋势页进入历史记录，删除对应条目。</p>
